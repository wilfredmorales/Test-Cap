name: Publicar web

# Publica la app en GitHub Pages (origen: "GitHub Actions").
# Se ejecuta al cambiar la app y también desde las tareas que regeneran el banco o el APK,
# porque los commits hechos por esas tareas no disparan otra publicación por sí solos.
on:
  push:
    branches: [claude/testcat-repo-review-540xv2]
    paths-ignore: ["fuentes/**", "docs/**", "supabase/**", "README.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/testcat-repo-review-540xv2   # siempre la última versión, incluidos los commits de las tareas
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r index.html app.js styles.css sw.js manifest.webmanifest .nojekyll icons data vendor _site/
          if [ -f dist/test-cap.apk ]; then mkdir -p _site/dist && cp dist/test-cap.apk _site/dist/; fi
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
