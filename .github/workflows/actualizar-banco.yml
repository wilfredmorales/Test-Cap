name: Actualizar banco de preguntas

# Cuando se sube un ZIP nuevo a fuentes/, regenera data/banco-cap.json.
# Las apps instaladas lo detectan solas al abrirse (o con el botón "Actualizar").
on:
  push:
    paths: ["fuentes/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar banco (falla si alguna pregunta no se lee bien)
        run: python scripts/build_banco.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar banco de preguntas"
          git push

  publicar:
    needs: generar
    uses: ./.github/workflows/publicar-web.yml
