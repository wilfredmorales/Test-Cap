name: APK Android

# Compila la app Android (APK de prueba) y la guarda en dist/test-cap.apk.
on:
  push:
    paths:
      - index.html
      - app.js
      - styles.css
      - icons/**
      - package.json
      - capacitor.config.json
      - scripts/iconos_android.py
      - .github/workflows/apk-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar proyecto
        run: |
          npm install --no-audit --no-fund
          npm run www
          npx cap add android
          pip install pillow
          python scripts/iconos_android.py
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/test-cap.apk
          ls -la dist
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add dist/test-cap.apk
          git commit -m "APK de prueba compilado" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
