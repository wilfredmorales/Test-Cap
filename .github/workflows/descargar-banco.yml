name: Descargar banco de preguntas

on:
  push:
    branches: [claude/testcat-repo-review-540xv2]
    paths: [scripts/descargar_paginas.py, .github/workflows/descargar-banco.yml]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # lunes 04:17 UTC

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/descargar_paginas.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add raw
          git diff --cached --quiet || git commit -m "Actualizar páginas del banco de preguntas"
          git push
