<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test CAP</title>
  <meta name="description" content="Tests del CAP de mercancías y viajeros con el banco oficial de preguntas">
  <meta name="theme-color" content="#3f3cbb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Test CAP">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="brand" type="button" aria-label="Inicio">
      <img src="icons/icon-192.png" alt="" width="28" height="28"> <span>Test CAP</span>
    </button>
    <div id="timer" class="timer hidden" aria-live="polite"></div>
  </header>

  <main id="app" class="container">
    <p class="muted">Cargando banco de preguntas…</p>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
